[project]
name = "repairhub"
version = "0.1.0"
description = "RepairHub Platform Frame v0.1 - synthetic reference flow"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.2",
  "psycopg[binary]>=3.1",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
lint = ["ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I", "UP"]  # generated

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: Depends(...) in argument defaults
extend-immutable-calls = ["fastapi.Depends", "app.auth.require", "app.auth.require_any"]

[tool.mypy]
python_version = "3.11"
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
