# Local, synthetic-data-only environment (docs/SPEC.md, section 2.2).
# Fill .env from .env.example first. Not for staging or production.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: repairhub
      POSTGRES_USER: repairhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repairhub"]
      interval: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://repairhub:${POSTGRES_PASSWORD}@db:5432/repairhub
    depends_on:
      db: { condition: service_healthy }
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    ports: ["${API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://repairhub:${POSTGRES_PASSWORD}@db:5432/repairhub
    depends_on:
      api: { condition: service_healthy }  # api applies migrations first
    command: ["python", "-m", "app.worker"]

volumes:
  dbdata:
